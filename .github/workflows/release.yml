name: Release

# Tags the commit that contains the built lib/ folder so the package can be
# installed with `bun add github:mogoe1/semaphore#<tag>`. Only the tag is pushed,
# main never receives build output.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build

      - name: Read version
        run: echo "TAG=v$(bun -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Ensure tag does not exist yet
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "Tag ${TAG} already exists. Bump the version in package.json first."
            exit 1
          fi

      - name: Commit build output and tag it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f lib
          git commit -m "Release ${TAG}"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" --verify-tag --generate-notes
